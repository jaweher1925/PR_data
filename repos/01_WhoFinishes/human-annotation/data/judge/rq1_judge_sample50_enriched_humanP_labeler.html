 1. \u74b0\u5883\u5909\u6570 `OPENAI_AGENTS_DISABLE_TRACING=1` \u3092\u8a2d\u5b9a\u3057\u3066\u30b0\u30ed\u30fc\u30d0\u30eb\u306b\u7121\u52b9\u5316\u3059\u308b\n-2. [`RunConfig.tracingDisabled`](/openai-agents-js/openai/agents-core/type-aliases/runconfig/#tracingdisabled) \u3092 `true` \u306b\u8a2d\u5b9a\u3057\u3066\u5358\u4e00\u306e\u5b9f\u884c\u306e\u307f\u7121\u52b9\u5316\u3059\u308b\n+2. 1 \u56de\u306e\u5b9f\u884c\u3060\u3051\u7121\u52b9\u5316\u3057\u305f\u3044\u5834\u5408\u306f [`RunConfig.tracingDisabled`](/openai-agents-js/openai/agents-core/type-aliases/runconfig/#tracingdisabled) \u306b `true` \u3092\u8a2d\u5b9a\u3059\u308b\n \n-**_OpenAI \u306e Zero Data Retention (ZDR) \u30dd\u30ea\u30b7\u30fc\u4e0b\u3067 API \u3092\u5229\u7528\u3057\u3066\u3044\u308b\u7d44\u7e54\u3067\u306f\u3001\u30c8\u30ec\u30fc\u30b7\u30f3\u30b0\u306f\u5229\u7528\u3067\u304d\u307e\u305b\u3093\u3002_**\n+**_OpenAI \u306e API \u3092 Zero Data Retention (ZDR) \u30dd\u30ea\u30b7\u30fc\u3067\u5229\u7528\u3057\u3066\u3044\u308b\u7d44\u7e54\u3067\u306f\u3001\u30c8\u30ec\u30fc\u30b7\u30f3\u30b0\u306f\u5229\u7528\u3067\u304d\u307e\u305b\u3093\u3002_**\n \n \u003c/Aside\u003e\n \n+## \u30a8\u30af\u30b9\u30dd\u30fc\u30c8\u30eb\u30fc\u30d7\u306e\u30e9\u30a4\u30d5\u30b5\u30a4\u30af\u30eb\n+\n+\u591a\u304f\u306e\u74b0\u5883\u3067\u306f\u3001\u30c8\u30ec\u30fc\u30b9\u306f\u4e00\u5b9a\u9593\u9694\u3067\u81ea\u52d5\u7684\u306b\u30a8\u30af\u30b9\u30dd\u30fc\u30c8\u3055\u308c\u307e\u3059\u3002\u30d6\u30e9\u30a6\u30b6\u3084 Cloudflare Workers \u3067\u306f\u3053\u306e\u6a5f\u80fd\u306f\u30c7\u30d5\u30a9\u30eb\u30c8\u3067\u7121\u52b9\u306b\u306a\u3063\u3066\u3044\u307e\u3059\u3002\u30ad\u30e5\u30fc\u306b\u6e9c\u307e\u308a\u3059\u304e\u305f\u5834\u5408\u306f\u30a8\u30af\u30b9\u30dd\u30fc\u30c8\u3055\u308c\u307e\u3059\u304c\u3001\u5b9a\u671f\u7684\u306b\u306f\u30a8\u30af\u30b9\u30dd\u30fc\u30c8\u3055\u308c\u307e\u305b\u3093\u3002\u305d\u306e\u305f\u3081\u3001\u30b3\u30fc\u30c9\u306e\u30e9\u30a4\u30d5\u30b5\u c8\u30ec\u30fc\u30b9\u306e\u4e00\u610f ID\u3002\u6307\u5b9a\u3057\u306a\u3044\u5834\u5408\u306f\u81ea\u52d5\u751f\u6210\u3002\u5f62\u5f0f\u306f `trace_\u003c32_alphanumeric\u003e`\n-  - `group_id`: \u7701\u7565\u53ef\u3002\u540c\u3058\u4f1a\u8a71\u304b\u3089\u306e\u8907\u6570\u30c8\u30ec\u30fc\u30b9\u3092\u95a2\u9023\u4ed8\u3051\u308b\u305f\u3081\u306e\u30b0\u30eb\u30fc\u30d7 ID\u3002\u4f8b: \u30c1\u30e3\u30c3\u30c8\u30b9\u30ec\u30c3\u30c9 ID \u306a\u3069\n-  - `disabled`: `true` \u306e\u5834\u5408\u3001\u3053\u306e\u30c8\u30ec\u30fc\u30b9\u306f\u8a18\u9332\u3055\u308c\u307e\u305b\u3093\n+  - `group_id`: \u4efb\u610f\u306e\u30b0\u30eb\u30fc\u30d7 ID\u3002\u540c\u3058\u4f1a\u8a71\u304b\u3089\u306e\u8907\u6570\u30c8\u30ec\u30fc\u30b9\u3092\u30ea\u30f3\u30af\u3059\u308b\u305f\u3081\u306b\u4f7f\u7528\u3002\u4f8b: \u30c1\u30e3\u30c3\u30c8\u30b9\u30ec\u30c3\u30c9 ID\n+  - `disabled`: `true` \u306e\u5834\u5408\u3001\u3053\u306e\u30c8\u30ec\u30fc\u30b9\u306f\u8a18\u9332\u3055\u308c\u306a\u3044\n   - `metadata`: \u30c8\u30ec\u30fc\u30b9\u306b\u4ed8\u4e0e\u3059\u308b\u4efb\u610f\u306e\u30e1\u30bf\u30c7\u30fc\u30bf\n-- **\u30b9\u30d1\u30f3**: \u958b\u59cb\u6642\u523b\u3068\u7d42\u4e86\u6642\u523b\u3092\u6301\u3064\u64cd\u4f5c\u3092\u8868\u3057\u307e\u3059\u3002\u30b9\u30d1\u30f3\u306b\u306f\u6b21\u304c\u3042\u308a\u307e\u3059:\n+- **\u30b9\u30d1\u30f3 (Span)** \u306f\u958b\u59cb\u6642\u523b\u3068\u7d42\u4e86\u6642\u523b\u3092\u6301\u3064\u64cd\u4f5c\u3092\u8868\u3057\u307e\u3059\u3002\u30b9\u30d1\u30f3\u306f\u4ee5\u4e0b\u3092\u6301\u3061\u307e\u3059:\n   - `started_at` \u3068 `ended_at` \u30bf\u30a4\u30e0\u30b9\u30bf\u30f3\u30d7\n-  - \u6240\u5c5e\u30c8\u30ec\u30fc\u30b9\u3092\u793a\u3059 `trace_id`\n-  - \u89aa\u30b9\u30d1\u30f3\u3092\u6307\u3059 `parent_id`\uff08\u5b58\u5728\u3059\u308b\u5834\u5408\uff09\n-  - \u30b9\u30d1\u30f3\u306b\u95a2\u3059\u308b\u60c5\u5831\u3092\u4fdd\u6301\u3059\u308b `span_data`\u3002\u4f8b: `AgentSpanData` \u306f\u30a8\u30fc\u30b8\u30a7\u30f3\u30c8\u60c5\u5831\u3001`GenerationSpanData` \u306f LLM \u751f\u6210\u60c5\u5831\u306a\u3069\n+  - \u6240\u5c5e\u3059\u308b\u30c8\u30ec\u30fc\u30b9\u3092\u793a\u3059 `trace_id`\n+  - \u89aa\u30b9\u30d1\u30f3\u3092\u6307\u3059 `parent_id` (\u5b58\u5728\u3059\u308b\u5834\u5408)\n+  - \u30b9\u30d1\u30f3\u306b\u95a2\u3059\u308b\u60c5\u5831\u3092\u542b\u3080 `span_data`\u3002\u305f\u3068\u3048\u3070 `AgentSpanData` \u306f\u30a8\u30fc\u30b8\u30a7\u30f3\u30c8\u60c5\u5831\u3001`GenerationSpanData` \u306f LLM \u751f\u6210\u60c5\u5831\u306a\u3069\n \n ## \u30c7\u30d5\u30a9\u30eb\u30c8\u306e\u30c8\u30ec\u30fc\u30b7\u30f3\u30b0\n \n-\u30c7\u30d5\u30a9\u30eb\u30c8\u3067\u306f\u3001SDK \u306f\u6b21\u3092\u30c8\u30ec\u30fc\u30b9\u3057\u307e\u3059:\n+\u30c7\u30d5\u30a9\u30eb\u30c8\u3067\u306f SDK \u304c\u6b21\u3092\u30c8\u30ec\u30fc\u30b9\u3057\u307e\u3059:\n \n-- `run()` \u307e\u305f\u306f `Runner.run()` \u5168\u4f53\u3092 `Trace` \u3067\u30e9\u30c3\u30d7\n+- `run()` \u307e\u305f\u306f `Runner.run()` \u5168\u4f53\u3092 1 \u3064\u306e `Trace` \u3067\u30e9\u30c3\u30d7\n - \u30a8\u30fc\u30b8\u30a7\u30f3\u30c8\u304c\u5b9f\u884c\u3055\u308c\u308b\u305f\u3073\u306b `AgentSpan` \u3067\u30e9\u30c3\u30d7\n - LLM \u751f\u6210\u3092 `GenerationSpan` \u3067\u30e9\u30c3\u30d7\n - \u95a2\u6570\u30c4\u30fc\u30eb\u547c\u3073\u51fa\u3057\u3092\u305d\u308c\u305e\u308c `FunctionSpan` \u3067\u30e9\u30c3\u30d7\n - \u30ac\u30fc\u30c9\u30ec\u30fc\u30eb\u3092 `GuardrailSpan` \u3067\u30e9\u30c3\u30d7\n - \u30cf\u30f3\u30c9\u30aa\u30d5\u3092 `HandoffSpan` \u3067\u30e9\u30c3\u30d7\n \n-\u30c8\u30ec\u30fc\u30b9\u540d\u306f\u30c7\u30d5\u30a9\u30eb\u30c8\u3067 \u300cAgent workflow\u300d \u3067\u3059\u3002`withTrace` \u3092\u4f7f\u7528\u3057\u3066\u540d\u524d\u3092\u8a2d\u5b9a\u3059\u308b\u304b\u3001[`RunConfig.workflowName`](/openai-agents-js/openai/agents-core/type-aliases/runconfig/#workflowname) \u3067\u540d\u524d\u3084\u305d\u306e\u4ed6\u30d7\u30ed\u30d1\u30c6\u30a3\u3092\u8a2d\u5b9a\u3067\u304d\u307e\u3059\u3002\n+\u30c8\u30ec\u30fc\u30b9\u540d\u306f\u30c7\u30d5\u30a9\u30eb\u30c8\u3067 \"Agent workflow\" \u3067\u3059\u3002`withTrace` \u3092\u4f7f\u7528\u3057\u3066\u3053\u306e\u540d\u524d\u3092\u8a2d\u5b9a\u3059\u308b\u304b\u3001[`RunConfig.workflowName`](/openai-agents-js/openai/agents-core/type-aliases/runconfig/#workflowname) \u3067\u540d\u524d\u3084\u305d\u306e\u4ed6\u306e\u30d7\u30ed\u30d1\u30c6\u30a3\u3092\u8a2d\u5b9a\u3067\u304d\u307e\u3059\u3002\n \n-\u3055\u3089\u306b\u3001[\u30ab\u30b9\u30bf\u30e0\u30c8\u30ec\u30fc\u30b9\u30d7\u30ed\u30bb\u30c3\u30b5](#custom-tracing-processors) \u3092\u8a2d\u5b9a\u3057\u3066\u3001\u4ed6\u306e\u9001\u4fe1\u5148\u3078\u30c8\u30ec\u30fc\u30b9\u3092\u9001\u4fe1\uff08\u7f6e\u63db\u307e\u305f\u306f\u8ffd\u52a0\uff09\u3059\u308b\u3053\u3068\u3082\u3067\u304d\u307e\u3059\u3002\n+\u3055\u3089\u306b\u3001[\u30ab\u30b9\u30bf\u30e0\u30c8\u30ec\u30fc\u30b9\u30d7\u30ed\u30bb\u30c3\u30b5](#custom-tracing-processors) \u3092\u8a2d\u5b9a\u3057\u3066\u3001\uff08\u7f6e\u304d\u63db\u3048\u307e\u305f\u306f\u8ffd\u52a0\u306e\u9001\u4fe1\u5148\u3068\u3057\u3066\uff09\u4ed6\u306e\u5834\u6240\u306b\u30c8\u30ec\u30fc\u30b9\u3092\u9001\u4fe1\u3067\u304d\u307e\u3059\u3002\n \n ### \u97f3\u58f0\u30a8\u30fc\u30b8\u30a7\u30f3\u30c8\u306e\u30c8\u30ec\u30fc\u30b7\u30f3\u30b0\n \n-`RealtimeAgent` \u3068 `RealtimeSession` \u3092 OpenAI Realtime API \u306e\u30c7\u30d5\u30a9\u30eb\u30c8\u8a2d\u5b9a\u3067\u4f7f\u7528\u3057\u3066\u3044\u308b\u5834\u5408\u3001\u30c8\u30ec\u30fc\u30b7\u30f3\u30b0\u306f Realtime API \u5074\u3067\u81ea\u52d5\u7684\u306b\u884c\u308f\u308c\u307e\u3059\u3002`RealtimeSession` \u3067 `tracingDisabled: true` \u3092\u8a2d\u5b9a\u3059\u308b\u304b\u3001`OPENAI_AGENTS_DISABLE_TRACING` \u74b0\u5883\u5909\u6570\u3092\u4f7f\u7528\u3059\u308b\u3068\u7121\u52b9\u5316\u3067\u304d\u307e\u3059\u3002\n+\u30c7\u30d5\u30a9\u30eb\u30c8\u306e OpenAI Realtime API \u3068\u3068\u3082\u306b `RealtimeAgent` \u3068 `RealtimeSession` \u3092\u4f7f\u7528\u3057\u3066\u3044\u308b\u5834\u5408\u3001`RealtimeSession` \u3067 `tracingDisabled: true` \u3092\u8a2d\u5b9a\u3059\u308b\u304b\u3001`OPENAI_AGENTS_DISABLE_TRACING` \u74b0\u5883\u5909\u6570\u3092\u4f7f\u7528\u3057\u3066\u7121\u52b9\u5316\u3057\u306a\u3044\u9650\u308a\u3001\u30c8\u30ec\u30fc\u30b7\u30f3\u30b0\u306f\u81ea\u52d5\u7684\u306b Realtime API \u5074\u3067\u884c\u308f\u308c\u307e\u3059\u3002\n \n \u8a73\u7d30\u306f [\u97f3\u58f0\u30a8\u30fc\u30b8\u30a7\u30f3\u30c8\u306e\u6982\u8981](/openai-agents-js/ja/guides/voice-agents) \u3092\u53c2\u7167\u3057\u3066\u304f\u3060\u3055\u3044\u3002\n \n-## \u4e0a\u4f4d\u30c8\u30ec\u30fc\u30b9\n+## \u9ad8\u30ec\u30d9\u30eb\u306e\u30c8\u30ec\u30fc\u30b9\n \n-\u8907\u6570\u56de\u306e `run()` \u547c\u3073\u51fa\u3057\u3092 1 \u3064\u306e\u30c8\u30ec\u30fc\u30b9\u306b\u307e\u3068\u3081\u305f\u3044\u5834\u5408\u304c\u3042\u308a\u307e\u3059\u3002\u305d\u306e\u5834\u5408\u3001\u30b3\u30fc\u30c9\u5168\u4f53\u3092 `withTrace()` \u3067\u30e9\u30c3\u30d7\u3057\u307e\u3059\u3002\n+\u8907\u6570\u56de\u306e `run()` \u547c\u3073\u51fa\u3057\u3092 1 \u3064\u306e\u30c8\u30ec\u30fc\u30b9\u306b\u307e\u3068\u3081\u305f\u3044\u5834\u5408\u304c\u3042\u308a\u307e\u3059\u3002\u305d\u306e\u5834\u5408\u306f\u30b3\u30fc\u30c9\u5168\u4f53\u3092 `withTrace()` \u3067\u30e9\u30c3\u30d7\u3057\u307e\u3059\u3002\n \n \u003cCode lang=\"typescript\" code={customTraceExample} /\u003e\n \n-1. `withTrace()` \u3067 2 \u56de\u306e `run` \u547c\u3073\u51fa\u3057\u3092\u30e9\u30c3\u30d7\u3057\u3066\u3044\u308b\u305f\u3081\u3001\u5404\u5b9f\u884c\u306f\u500b\u5225\u306b\u30c8\u30ec\u30fc\u30b9\u3092\u4f5c\u6210\u305b\u305a\u3001\u5168\u4f53\u306e\u30c8\u30ec\u30fc\u30b9\u306b\u542b\u307e\u308c\u307e\u3059\u3002\n+1. 2 \u56de\u306e `run` \u547c\u3073\u51fa\u3057\u306f `withTrace()` \u3067\u30e9\u30c3\u30d7\u3055\u308c\u3066\u3044\u308b\u305f\u3081\u3001\u500b\u5225\u306e\u30c8\u30ec\u30fc\u30b9\u3092\u4f5c\u6210\u305b\u305a\u5168\u4f53\u30c8\u30ec\u30fc\u30b9\u306e\u4e00\u90e8\u306b\u306a\u308a\u307e\u3059\u3002\n \n ## \u30c8\u30ec\u30fc\u30b9\u306e\u4f5c\u6210\n \n-[`withTrace()`](/openai-agents-js/openai/agents-core/functions/withtrace/) \u95a2\u6570\u3067\u30c8\u30ec\u30fc\u30b9\u3092\u4f5c\u6210\u3067\u304d\u307e\u3059\u3002\u3042\u308b\u3044\u306f `getGlobalTraceProvider().createTrace()` \u3067\u624b\u52d5\u3067\u65b0\u3057\u3044\u30c8\u30ec\u30fc\u30b9\u3092\u751f\u6210\u3057\u3001\u305d\u308c\u3092 `withTrace()` \u306b\u6e21\u3059\u3053\u3068\u3082\u53ef\u80fd\u3067\u3059\u3002\n+[`withTrace()`](/openai-agents-js/openai/agents-core/functions/withtrace/) \u95a2\u6570\u3092\u4f7f\u3063\u3066\u30c8\u30ec\u30fc\u30b9\u3092\u4f5c\u6210\u3067\u304d\u307e\u3059\u3002\u3042\u308b\u3044\u306f `getGlobalTraceProvider().createTrace()` \u3067\u624b\u52d5\u3067\u65b0\u3057\u3044\u30c8\u30ec\u30fc\u30b9\u3092\u4f5c\u6210\u3057\u3001\u305d\u308c\u3092 `withTrace()` \u306b\u6e21\u3059\u3053\u3068\u3082\u53ef\u80fd\u3067\u3059\u3002\n \n-\u73fe\u5728\u306e\u30c8\u30ec\u30fc\u30b9\u306f [Node.js `AsyncLocalStorage`](https://nodejs.org/api/async_context.html#class-asynclocalstorage) \u307e\u305f\u306f\u540c\u7b49\u306e\u74b0\u5883\u30dd\u30ea\u30d5\u30a3\u30eb\u306b\u3088\u308a\u8ffd\u8de1\u3055\u308c\u308b\u305f\u3081\u3001\u4e26\u5217\u51e6\u7406\u3067\u3082\u81ea\u52d5\u7684\u306b\u6a5f\u80fd\u3057\u307e\u3059\u3002\n+\u73fe\u5728\u306e\u30c8\u30ec\u30fc\u30b9\u306f [Node.js `AsyncLocalStorage`](https://nodejs.org/api/async_context.html#class-asynclocalstorage) \u307e\u305f\u306f\u5404\u74b0\u5883\u306e\u30dd\u30ea\u30d5\u30a3\u30eb\u3092\u901a\u3058\u3066\u8ffd\u8de1\u3055\u308c\u307e\u3059\u3002\u3053\u308c\u306b\u3088\u308a\u4e26\u884c\u51e6\u7406\u3067\u3082\u81ea\u52d5\u7684\u306b\u6a5f\u80fd\u3057\u307e\u3059\u3002\n \n ## \u30b9\u30d1\u30f3\u306e\u4f5c\u6210\n \n-`createGenerationSpan()` \u3084 `createFunctionSpan()` \u306a\u3069\u3001\u5404\u7a2e `create*Span()` \u30e1\u30bd\u30c3\u30c9\u3067\u30b9\u30d1\u30f3\u3092\u4f5c\u6210\u3067\u304d\u307e\u3059\u3002\u901a\u5e38\u306f\u624b\u52d5\u3067\u30b9\u30d1\u30f3\u3092\u4f5c\u6210\u3059\u308b\u5fc5\u8981\u306f\u3042\u308a\u307e\u305b\u3093\u3002\u30ab\u30b9\u30bf\u30e0\u30b9\u30d1\u30f3\u3092\u8ffd\u8de1\u3059\u308b\u306b\u306f [`createCustomSpan()`](/openai-agents-js/openai/agents-core/functions/createcustomspan/) \u3092\u4f7f\u7528\u3057\u3066\u304f\u3060\u3055\u3044\u3002\n+`createGenerationSpan()` \u3084 `createFunctionSpan()` \u306a\u3069\u306e `create*Span()` \u30e1\u30bd\u30c3\u30c9\u3092\u4f7f\u3063\u3066\u30b9\u30d1\u30f3\u3092\u4f5c\u6210\u3067\u304d\u307e\u3059\u3002\u4e00\u822c\u7684\u306b\u306f\u624b\u52d5\u3067\u30b9\u30d1\u30f3\u3092\u4f5c\u6210\u3059\u308b\u5fc5\u8981\u306f\u3042\u308a\u307e\u305b\u3093\u3002\u30ab\u30b9\u30bf\u30e0\u30b9\u30d1\u30f3\u3092\u8ffd\u8de1\u3059\u308b\u305f\u3081\u306e [`createCustomSpan()`](/openai-agents-js/openai/agents-core/functions/createcustomspan/) \u3082\u7528\u610f\u3055\u308c\u3066\u3044\u307e\u3059\u3002\n \n-\u30b9\u30d1\u30f3\u306f\u81ea\u52d5\u7684\u306b\u73fe\u5728\u306e\u30c8\u30ec\u30fc\u30b9\u306b\u542b\u307e\u308c\u3001\u6700\u3082\u8fd1\u3044\u73fe\u5728\u306e\u30b9\u30d1\u30f3\u306e\u4e0b\u306b\u30cd\u30b9\u30c8\u3055\u308c\u307e\u3059\u3002\u3053\u308c\u3082 [Node.js `AsyncLocalStorage`](https://nodejs.org/a", "p_patch": "@@ -6,91 +6,91 @@ description: Learn how to trace your agent runs\n import { Aside, Code } from '@astrojs/starlight/components';\n import customTraceExample from '../../../../../../examples/docs/custom-trace.ts?raw';\n \n-Agents SDK \u306b\u306f\u7d44\u307f\u8fbc\u307f\u306e\u30c8\u30ec\u30fc\u30b7\u30f3\u30b0\u6a5f\u80fd\u304c\u3042\u308a\u3001\u30a8\u30fc\u30b8\u30a7\u30f3\u30c8\u5b9f\u884c\u4e2d\u306b\u767a\u751f\u3059\u308b\u30a4\u30d9\u30f3\u30c8\u306e\u7db2\u7f85\u7684\u306a\u8a18\u9332\u3092\u53ce\u96c6\u3057\u307e\u3059\u3002\u3053\u308c\u306b\u306f LLM \u306e\u751f\u6210\u3001\u30c4\u30fc\u30eb\u547c\u3073\u51fa\u3057\u3001\u30cf\u30f3\u30c9\u30aa\u30d5\u3001\u30ac\u30fc\u30c9\u30ec\u30fc\u30eb\u3001\u3055\u3089\u306b\u306f\u30ab\u30b9\u30bf\u30e0\u30a4\u30d9\u30f3\u30c8\u307e\u3067\u3082\u542b\u307e\u308c\u307e\u3059\u3002[Traces \u30c0\u30c3\u30b7\u30e5\u30dc\u30fc\u30c9](https://platform.openai.com/traces)\u3092\u4f7f\u3046\u3068\u3001\u958b\u767a\u6642\u3084\u672c\u756a\u74b0\u5883\u3067\u30ef\u30fc\u30af\u30d5\u30ed\u30fc\u3092\u30c7\u30d0\u30c3\u30b0\u30fb\u53ef\u8996\u5316\u30fb\u30e2\u30cb\u30bf\u30ea\u30f3\u30b0\u3067\u304d\u307e\u3059\u3002\n+Agents SDK \u306b\u306f\u30c8\u30ec\u30fc\u30b7\u30f3\u30b0\u6a5f\u80fd\u304c\u7d44\u307f\u8fbc\u307e\u308c\u3066\u304a\u308a\u3001\u30a8\u30fc\u30b8\u30a7\u30f3\u30c8\u306e\u5b9f\u884c\u4e2d\u306b\u767a\u751f\u3059\u308b LLM \u751f\u6210\u3001\u30c4\u30fc\u30eb\u547c\u3073\u51fa\u3057\u3001\u30cf\u30f3\u30c9\u30aa\u30d5\u3001\u30ac\u30fc\u30c9\u30ec\u30fc\u30eb\u3001\u3055\u3089\u306b\u306f\u30ab\u30b9\u30bf\u30e0\u30a4\u30d9\u30f3\u30c8\u307e\u3067\u3001\u3042\u3089\u3086\u308b\u30a4\u30d9\u30f3\u30c8\u3092\u8a73\u7d30\u306b\u8a18\u9332\u3057\u307e\u3059\u3002  \n+[Traces \u30c0\u30c3\u30b7\u30e5\u30dc\u30fc\u30c9](https://platform.openai.com/traces) \u3092\u4f7f\u7528\u3059\u308b\u3068\u3001\u958b\u767a\u6642\u304a\u3088\u3073\u672c\u756a\u74b0\u5883\u3067\u30ef\u30fc\u30af\u30d5\u30ed\u30fc\u3092\u30c7\u30d0\u30c3\u30b0\u3001\u53ef\u8996\u5316\u3001\u76e3\u8996\u3067\u304d\u307e\u3059\u3002\n \n \u003cAside type=\"note\"\u003e\n \n-\u30c8\u30ec\u30fc\u30b7\u30f3\u30b0\u306f\u30c7\u30d5\u30a9\u30eb\u30c8\u3067\u6709\u52b9\u306b\u306a\u3063\u3066\u3044\u307e\u3059\u3002\u7121\u52b9\u5316\u3059\u308b\u65b9\u6cd5\u306f 2 \u3064\u3042\u308a\u307e\u3059\u3002\n+\u30c8\u30ec\u30fc\u30b7\u30f3\u30b0\u306f\u30c7\u30d5\u30a9\u30eb\u30c8\u3067\u6709\u52b9\u306b\u306a\u3063\u3066\u3044\u307e\u3059\u3002\u7121\u52b9\u306b\u3059\u308b\u65b9\u6cd5\u306f\u6b21\u306e 2 \u3064\u3067\u3059\u3002\n \n 1. \u74b0\u5883\u5909\u6570 `OPENAI_AGENTS_DISABLE_TRACING=1` \u3092\u8a2d\u5b9a\u3057\u3066\u30b0\u30ed\u30fc\u30d0\u30eb\u306b\u7121\u52b9\u5316\u3059\u308b\n-2. 1 \u56de\u306e\u5b9f\u884c\u3060\u3051\u7121\u52b9\u5316\u3057\u305f\u3044\u5834\u5408\u306f\u3001[`RunConfig.tracingDisabled`](/openai-agents-js/openai/agents-core/type-aliases/runconfig/#tracingdisabled) \u3092 `true` \u306b\u8a2d\u5b9a\u3059\u308b\n+2. [`RunConfig.tracingDisabled`](/openai-agents-js/openai/agents-core/type-aliases/runconfig/#tracingdisabled) \u3092 `true` \u306b\u8a2d\u5b9a\u3057\u3066\u5358\u4e00\u306e\u5b9f\u884c\u306e\u307f\u7121\u52b9\u5316\u3059\u308b\n \n-**_OpenAI \u306e API \u3092 Zero Data Retention (ZDR) \u30dd\u30ea\u30b7\u30fc\u3067\u5229\u7528\u3057\u3066\u3044\u308b\u7d44\u7e54\u3067\u306f\u3001\u30c8\u30ec\u30fc\u30b7\u30f3\u30b0\u306f\u5229\u7528\u3067\u304d\u307e\u305b\u3093\u3002_**\n+**_OpenAI \u306e Zero Data Retention (ZDR) \u30dd\u30ea\u30b7\u30fc\u4e0b\u3067 API \u3092\u5229\u7528\u3057\u3066\u3044\u308b\u7d44\u7e54\u3067\u306f\u3001\u30c8\u30ec\u30fc\u30b7\u30f3\u30b0\u306f\u5229\u7528\u3067\u304d\u307e\u305b\u3093\u3002_**\n \n \u003c/Aside\u003e\n \n ## \u30c8\u30ec\u30fc\u30b9\u3068\u30b9\u30d1\u30f3\n \n-- **\u30c8\u30ec\u30fc\u30b9 (Trace)** \u306f\u300c\u30ef\u30fc\u30af\u30d5\u30ed\u30fc\u300d\u306e\u5358\u4e00\u306e\u30a8\u30f3\u30c9\u30c4\u30fc\u30a8\u30f3\u30c9\u64cd\u4f5c\u3092\u8868\u3057\u307e\u3059\u3002\u30c8\u30ec\u30fc\u30b9\u306f Span \u3067\u69cb\u6210\u3055\u308c\u3001\u6b21\u306e\u30d7\u30ed\u30d1\u30c6\u30a3\u3092\u6301\u3061\u307e\u3059\n-  - `workflow_name`: \u300c\u30b3\u30fc\u30c9\u751f\u6210\u300d\u300c\u30ab\u30b9\u30bf\u30de\u30fc\u30b5\u30fc\u30d3\u30b9\u300d\u306a\u3069\u3001\u8ad6\u7406\u7684\u306a\u30ef\u30fc\u30af\u30d5\u30ed\u30fc\u307e\u305f\u306f\u30a2\u30d7\u30ea\u306e\u540d\u524d\n-  - `trace_id`: \u30c8\u30ec\u30fc\u30b9\u306e\u4e00\u610f ID\u3002\u6307\u5b9a\u3057\u306a\u3044\u5834\u5408\u306f\u81ea\u52d5\u751f\u6210\u3055\u308c\u307e\u3059\u3002\u5f62\u5f0f\u306f `trace_\u003c32_alphanumeric\u003e`\n-  - `group_id`: \u4f1a\u8a71\u306e\u8907\u6570\u30c8\u30ec\u30fc\u30b9\u3092\u30ea\u30f3\u30af\u3059\u308b\u305f\u3081\u306e\u30aa\u30d7\u30b7\u30e7\u30f3 ID\u3002\u4f8b\u3068\u3057\u3066\u30c1\u30e3\u30c3\u30c8\u30b9\u30ec\u30c3\u30c9 ID \u306a\u3069\n+- **\u30c8\u30ec\u30fc\u30b9**: 1 \u3064\u306e\u300c\u30ef\u30fc\u30af\u30d5\u30ed\u30fc\u300d\u306e\u30a8\u30f3\u30c9\u30c4\u30fc\u30a8\u30f3\u30c9\u306e\u64cd\u4f5c\u3092\u8868\u3057\u307e\u3059\u3002\u30c8\u30ec\u30fc\u30b9\u306f\u30b9\u30d1\u30f3\u3067\u69cb\u6210\u3055\u308c\u3001\u6b21\u306e\u30d7\u30ed\u30d1\u30c6\u30a3\u304c\u3042\u308a\u307e\u3059:\n+  - `workflow_name`: \u8ad6\u7406\u7684\u306a\u30ef\u30fc\u30af\u30d5\u30ed\u30fc\u307e\u305f\u306f\u30a2\u30d7\u30ea\u540d\u3002\u4f8b: \u300cCode generation\u300d\u3084\u300cCustomer service\u300d\n+  - `trace_id`: \u30c8\u30ec\u30fc\u30b9\u306e\u4e00\u610f ID\u3002\u6307\u5b9a\u3057\u306a\u3044\u5834\u5408\u306f\u81ea\u52d5\u751f\u6210\u3002\u5f62\u5f0f\u306f `trace_\u003c32_alphanumeric\u003e`\n+  - `group_id`: \u7701\u7565\u53ef\u3002\u540c\u3058\u4f1a\u8a71\u304b\u3089\u306e\u8907\u6570\u30c8\u30ec\u30fc\u30b9\u3092\u95a2\u9023\u4ed8\u3051\u308b\u305f\u3081\u306e\u30b0\u30eb\u30fc\u30d7 ID\u3002\u4f8b: \u30c1\u30e3\u30c3\u30c8\u30b9\u30ec\u30c3\u30c9 ID \u306a\u3069\n   - `disabled`: `true` \u306e\u5834\u5408\u3001\u3053\u306e\u30c8\u30ec\u30fc\u30b9\u306f\u8a18\u9332\u3055\u308c\u307e\u305b\u3093\n   - `metadata`: \u30c8\u30ec\u30fc\u30b9\u306b\u4ed8\u4e0e\u3059\u308b\u4efb\u610f\u306e\u30e1\u30bf\u30c7\u30fc\u30bf\n-- **\u30b9\u30d1\u30f3 (Span)** \u306f\u958b\u59cb\u6642\u523b\u3068\u7d42\u4e86\u6642\u523b\u3092\u6301\u3064\u64cd\u4f5c\u3092\u8868\u3057\u307e\u3059\n-  - `started_at` \u3068 `ended_at` \u306e\u30bf\u30a4\u30e0\u30b9\u30bf\u30f3\u30d7\n-  - \u6240\u5c5e\u3059\u308b\u30c8\u30ec\u30fc\u30b9\u3092\u793a\u3059 `trace_id`\n-  - \u89aa Span \u3092\u6307\u3059 `parent_id`\uff08\u5b58\u5728\u3059\u308b\u5834\u5408\uff09\n-  - `span_data`: Span \u306e\u60c5\u5831\u3002\u305f\u3068\u3048\u3070 `AgentSpanData` \u306f\u30a8\u30fc\u30b8\u30a7\u30f3\u30c8\u60c5\u5831\u3001`GenerationSpanData` \u306f LLM \u751f\u6210\u60c5\u5831\u306a\u3069\n+- **\u30b9\u30d1\u30f3**: \u958b\u59cb\u6642\u523b\u3068\u7d42\u4e86\u6642\u523b\u3092\u6301\u3064\u64cd\u4f5c\u3092\u8868\u3057\u307e\u3059\u3002\u30b9\u30d1\u30f3\u306b\u306f\u6b21\u304c\u3042\u308a\u307e\u3059:\n+  - `started_at` \u3068 `ended_at` \u30bf\u30a4\u30e0\u30b9\u30bf\u30f3\u30d7\n+  - \u6240\u5c5e\u30c8\u30ec\u30fc\u30b9\u3092\u793a\u3059 `trace_id`\n+  - \u89aa\u30b9\u30d1\u30f3\u3092\u6307\u3059 `parent_id`\uff08\u5b58\u5728\u3059\u308b\u5834\u5408\uff09\n+  - \u30b9\u30d1\u30f3\u306b\u95a2\u3059\u308b\u60c5\u5831\u3092\u4fdd\u6301\u3059\u308b `span_data`\u3002\u4f8b: `AgentSpanData` \u306f\u30a8\u30fc\u30b8\u30a7\u30f3\u30c8\u60c5\u5831\u3001`GenerationSpanData` \u306f LLM \u751f\u6210\u60c5\u5831\u306a\u3069\n \n ## \u30c7\u30d5\u30a9\u30eb\u30c8\u306e\u30c8\u30ec\u30fc\u30b7\u30f3\u30b0\n \n-\u30c7\u30d5\u30a9\u30eb\u30c8\u3067\u306f\u3001SDK \u306f\u6b21\u3092\u30c8\u30ec\u30fc\u30b9\u3057\u307e\u3059\u3002\n+\u30c7\u30d5\u30a9\u30eb\u30c8\u3067\u306f\u3001SDK \u306f\u6b21\u3092\u30c8\u30ec\u30fc\u30b9\u3057\u307e\u3059:\n \n-- `run()` \u307e\u305f\u306f `Runner.run()` \u5168\u4f53\u3092 1 \u3064\u306e `Trace` \u3067\u30e9\u30c3\u30d7\n-- \u30a8\u30fc\u30b8\u30a7\u30f3\u30c8\u5b9f\u884c\u3054\u3068\u306b `AgentSpan` \u3067\u30e9\u30c3\u30d7\n-- LLM \u751f\u6210\u306f `GenerationSpan` \u3067\u30e9\u30c3\u30d7\n-- \u95a2\u6570\u30c4\u30fc\u30eb\u547c\u3073\u51fa\u3057\u306f\u305d\u308c\u305e\u308c `FunctionSpan` \u3067\u30e9\u30c3\u30d7\n-- \u30ac\u30fc\u30c9\u30ec\u30fc\u30eb\u306f `GuardrailSpan` \u3067\u30e9\u30c3\u30d7\n-- \u30cf\u30f3\u30c9\u30aa\u30d5\u306f `HandoffSpan` \u3067\u30e9\u30c3\u30d7\n+- `run()` \u307e\u305f\u306f `Runner.run()` \u5168\u4f53\u3092 `Trace` \u3067\u30e9\u30c3\u30d7\n+- \u30a8\u30fc\u30b8\u30a7\u30f3\u30c8\u304c\u5b9f\u884c\u3055\u308c\u308b\u305f\u3073\u306b `AgentSpan` \u3067\u30e9\u30c3\u30d7\n+- LLM \u751f\u6210\u3092 `GenerationSpan` \u3067\u30e9\u30c3\u30d7\n+- \u95a2\u6570\u30c4\u30fc\u30eb\u547c\u3073\u51fa\u3057\u3092\u305d\u308c\u305e\u308c `FunctionSpan` \u3067\u30e9\u30c3\u30d7\n+- \u30ac\u30fc\u30c9\u30ec\u30fc\u30eb\u3092 `GuardrailSpan` \u3067\u30e9\u30c3\u30d7\n+- \u30cf\u30f3\u30c9\u30aa\u30d5\u3092 `HandoffSpan` \u3067\u30e9\u30c3\u30d7\n \n-\u30c8\u30ec\u30fc\u30b9\u540d\u306f\u30c7\u30d5\u30a9\u30eb\u30c8\u3067 \"Agent workflow\" \u3067\u3059\u3002`withTrace` \u3092\u4f7f\u3046\u3001\u307e\u305f\u306f [`RunConfig.workflowName`](/openai/agents-core/type-aliases/runconfig/#workflowname) \u3067\u540d\u524d\u3084\u4ed6\u306e\u30d7\u30ed\u30d1\u30c6\u30a3\u3092\u8a2d\u5b9a\u3067\u304d\u307e\u3059\u3002\n+\u30c8\u30ec\u30fc\u30b9\u540d\u306f\u30c7\u30d5\u30a9\u30eb\u30c8\u3067 \u300cAgent workflow\u300d \u3067\u3059\u3002`withTrace` \u3092\u4f7f\u7528\u3057\u3066\u540d\u524d\u3092\u8a2d\u5b9a\u3059\u308b\u304b\u3001[`RunConfig.workflowName`](/openai-agents-js/openai/agents-core/type-aliases/runconfig/#workflowname) \u3067\u540d\u524d\u3084\u305d\u306e\u4ed6\u30d7\u30ed\u30d1\u30c6\u30a3\u3092\u8a2d\u5b9a\u3067\u304d\u307e\u3059\u3002\n \n-\u3055\u3089\u306b\u3001[\u30ab\u30b9\u30bf\u30e0\u30c8\u30ec\u30fc\u30b9\u30d7\u30ed\u30bb\u30c3\u30b5](#custom-tracing-processors)\u3092\u8a2d\u5b9a\u3057\u3066\u3001\u30c8\u30ec\u30fc\u30b9\u3092\u5225\u306e\u5b9b\u5148\u3078\u9001\u4fe1\uff08\u7f6e\u63db\u307e\u305f\u306f\u8ffd\u52a0\uff09\u3059\u308b\u3053\u3068\u3082\u3067\u304d\u307e\u3059\u3002\n+\u3055\u3089\u306b\u3001[\u30ab\u30b9\u30bf\u30e0\u30c8\u30ec\u30fc\u30b9\u30d7\u30ed\u30bb\u30c3\u30b5](#custom-tracing-processors) \u3092\u8a2d\u5b9a\u3057\u3066\u3001\u4ed6\u306e\u9001\u4fe1\u5148\u3078\u30c8\u30ec\u30fc\u30b9\u3092\u9001\u4fe1\uff08\u7f6e\u63db\u307e\u305f\u306f\u8ffd\u52a0\uff09\u3059\u308b\u3053\u3068\u3082\u3067\u304d\u307e\u3059\u3002\n \n ### \u97f3\u58f0\u30a8\u30fc\u30b8\u30a7\u30f3\u30c8\u306e\u30c8\u30ec\u30fc\u30b7\u30f3\u30b0\n \n-\u65e2\u5b9a\u306e OpenAI Realtime API \u3067 `RealtimeAgent` \u3068 `RealtimeSession` \u3092\u4f7f\u7528\u3057\u3066\u3044\u308b\u5834\u5408\u3001\u30c8\u30ec\u30fc\u30b7\u30f3\u30b0\u306f Realtime API \u5074\u3067\u81ea\u52d5\u7684\u306b\u884c\u308f\u308c\u307e\u3059\u3002\u30c8\u30ec\u30fc\u30b7\u30f3\u30b0\u3092\u7121\u52b9\u5316\u3059\u308b\u306b\u306f `RealtimeSession` \u306e `tracingDisabled: true` \u304b\u3001\u74b0\u5883\u5909\u6570 `OPENAI_AGENTS_DISABLE_TRACING` \u3092\u8a2d\u5b9a\u3057\u3066\u304f\u3060\u3055\u3044\u3002\n+`RealtimeAgent` \u3068 `RealtimeSession` \u3092 OpenAI Realtime API \u306e\u30c7\u30d5\u30a9\u30eb\u30c8\u8a2d\u5b9a\u3067\u4f7f\u7528\u3057\u3066\u3044\u308b\u5834\u5408\u3001\u30c8\u30ec\u30fc\u30b7\u30f3\u30b0\u306f Realtime API \u5074\u3067\u81ea\u52d5\u7684\u306b\u884c\u308f\u308c\u307e\u3059\u3002`RealtimeSession` \u3067 `tracingDisabled: true` \u3092\u8a2d\u5b9a\u3059\u308b\u304b\u3001`OPENAI_AGENTS_DISABLE_TRACING` \u74b0\u5883\u5909\u6570\u3092\u4f7f\u7528\u3059\u308b\u3068\u7121\u52b9\u5316\u3067\u304d\u307e\u3059\u3002\n \n-\u8a73\u7d30\u306f[\u97f3\u58f0\u30a8\u30fc\u30b8\u30a7\u30f3\u30c8\u306e\u6982\u8981](/ja/guides/voice-agents)\u3092\u53c2\u7167\u3057\u3066\u304f\u3060\u3055\u3044\u3002\n+\u8a73\u7d30\u306f [\u97f3\u58f0\u30a8\u30fc\u30b8\u30a7\u30f3\u30c8\u306e\u6982\u8981](/openai-agents-js/ja/guides/voice-agents) \u3092\u53c2\u7167\u3057\u3066\u304f\u3060\u3055\u3044\u3002\n \n-## \u3088\u308a\u9ad8\u3044\u30ec\u30d9\u30eb\u306e\u30c8\u30ec\u30fc\u30b9\n+## \u4e0a\u4f4d\u30c8\u30ec\u30fc\u30b9\n \n-\u8907\u6570\u56de\u306e `run()` \u547c\u3073\u51fa\u3057\u3092 1 \u3064\u306e\u30c8\u30ec\u30fc\u30b9\u306b\u307e\u3068\u3081\u305f\u3044\u5834\u5408\u306f\u3001\u30b3\u30fc\u30c9\u5168\u4f53\u3092 `withTrace()` \u3067\u30e9\u30c3\u30d7\u3057\u307e\u3059\u3002\n+\u8907\u6570\u56de\u306e `run()` \u547c\u3073\u51fa\u3057\u3092 1 \u3064\u306e\u30c8\u30ec\u30fc\u30b9\u306b\u307e\u3068\u3081\u305f\u3044\u5834\u5408\u304c\u3042\u308a\u307e\u3059\u3002\u305d\u306e\u5834\u5408\u3001\u30b3\u30fc\u30c9\u5168\u4f53\u3092 `withTrace()` \u3067\u30e9\u30c3\u30d7\u3057\u307e\u3059\u3002\n \n \u003cCode lang=\"typescript\" code={customTraceExample} /\u003e\n \n-1. `run` \u306e 2 \u56de\u306e\u547c\u3073\u51fa\u3057\u304c `withTrace()` \u306b\u5305\u307e\u308c\u3066\u3044\u308b\u305f\u3081\u3001\u305d\u308c\u305e\u308c\u304c\u500b\u5225\u306e\u30c8\u30ec\u30fc\u30b9\u3092\u4f5c\u3089\u305a\u3001\u5168\u4f53\u306e\u30c8\u30ec\u30fc\u30b9\u306b\u542b\u307e\u308c\u307e\u3059\n+1. `withTrace()` \u3067 2 \u56de\u306e `run` \u547c\u3073\u51fa\u3057\u3092\u30e9\u30c3\u30d7\u3057\u3066\u3044\u308b\u305f\u3081\u3001\u5404\u5b9f\u884c\u306f\u500b\u5225\u306b\u30c8\u30ec\u30fc\u30b9\u3092\u4f5c\u6210\u305b\u305a\u3001\u5168\u4f53\u306e\u30c8\u30ec\u30fc\u30b9\u306b\u542b\u307e\u308c\u307e\u3059\u3002\n \n ## \u30c8\u30ec\u30fc\u30b9\u306e\u4f5c\u6210\n \n-[`withTrace()`](/openai/agents-core/functions/withtrace/) \u95a2\u6570\u3092\u4f7f\u3063\u3066\u30c8\u30ec\u30fc\u30b9\u3092\u4f5c\u6210\u3067\u304d\u307e\u3059\u3002\u3042\u308b\u3044\u306f `getGlobalTraceProvider().createTrace()` \u3067\u30c8\u30ec\u30fc\u30b9\u3092\u624b\u52d5\u4f5c\u6210\u3057\u3001`withTrace()` \u306b\u6e21\u3059\u3053\u3068\u3082\u53ef\u80fd\u3067\u3059\u3002\n+[`withTrace()`](/openai-agents-js/openai/agents-core/functions/withtrace/) \u95a2\u6570\u3067\u30c8\u30ec\u30fc\u30b9\u3092\u4f5c\u6210\u3067\u304d\u307e\u3059\u3002\u3042\u308b\u3044\u306f `getGlobalTraceProvider().createTrace()` \u3067\u624b\u52d5\u3067\u65b0\u3057\u3044\u30c8\u30ec\u30fc\u30b9\u3092\u751f\u6210\u3057\u3001\u305d\u308c\u3092 `withTrace()` \u306b\u6e21\u3059\u3053\u3068\u3082\u53ef\u80fd\u3067\u3059\u3002\n \n-\u73fe\u5728\u306e\u30c8\u30ec\u30fc\u30b9\u306f [Node.js \u306e `AsyncLocalStorage`](https://nodejs.org/api/async_context.html#class-asynclocalstorage) \u307e\u305f\u306f\u305d\u308c\u306b\u76f8\u5f53\u3059\u308b\u30dd\u30ea\u30d5\u30a3\u30eb\u3067\u8ffd\u8de1\u3055\u308c\u308b\u305f\u3081\u3001\u4e26\u884c\u5b9f\u884c\u6642\u306b\u3082\u81ea\u52d5\u3067\u6a5f\u80fd\u3057\u307e\u3059\u3002\n+\u73fe\u5728\u306e\u30c8\u30ec\u30fc\u30b9\u306f [Node.js `AsyncLocalStorage`](https://nodejs.org/api/async_context.html#class-asynclocalstorage) \u307e\u305f\u306f\u540c\u7b49\u306e\u74b0\u5883\u30dd\u30ea\u30d5\u30a3\u30eb\u306b\u3088\u308a\u8ffd\u8de1\u3055\u308c\u308b\u305f\u3081\u3001\u4e26\u5217\u51e6\u7406\u3067\u3082\u81ea\u52d5\u7684\u306b\u6a5f\u80fd\u3057\u307e\u3059\u3002\n \n ## \u30b9\u30d1\u30f3\u306e\u4f5c\u6210\n \n-`createGenerationSpan()` \u3084 `createFunctionSpan()` \u306a\u3069\u306e `create*Span()` \u30e1\u30bd\u30c3\u30c9\u3067\u30b9\u30d1\u30f3\u3092\u4f5c\u6210\u3067\u304d\u307e\u3059\u3002\u901a\u5e38\u306f\u624b\u52d5\u3067\u4f5c\u6210\u3059\u308b\u5fc5\u8981\u306f\u3042\u308a\u307e\u305b\u3093\u3002\u72ec\u81ea\u306e\u30b9\u30d1\u30f3\u3092\u8ffd\u8de1\u3057\u305f\u3044\u5834\u5408\u306f [`createCustomSpan()`](/openai/agents-core/functions/createcustomspan/) \u304c\u5229\u7528\u3067\u304d\u307e\u3059\u3002\n+`createGenerationSpan()` \u3084 `createFunctionSpan()` \u306a\u3069\u3001\u5404\u7a2e `create*Span()` \u30e1\u30bd\u30c3\u30c9\u3067\u30b9\u30d1\u30f3\u3092\u4f5c\u6210\u3067\u304d\u307e\u3059\u3002\u901a\u5e38\u306f\u624b\u52d5\u3067\u30b9\u30d1\u30f3\u3092\u4f5c\u6210\u3059\u308b\u5fc5\u8981\u306f\u3042\u308a\u307e\u305b\u3093\u3002\u30ab\u30b9\u30bf\u30e0\u30b9\u30d1\u30f3\u3092\u8ffd\u8de1\u3059\u308b\u306b\u306f [`createCustomSpan()`](/openai-agents-js/openai/agents-core/functions/createcustomspan/) \u3092\u4f7f\u7528\u3057\u3066\u304f\u3060\u3055\u3044\u3002\n \n-\u30b9\u30d1\u30f3\u306f\u81ea\u52d5\u7684\u306b\u73fe\u5728\u306e\u30c8\u30ec\u30fc\u30b9\u306b\u5c5e\u3057\u3001\u6700\u3082\u8fd1\u3044\u89aa\u30b9\u30d1\u30f3\u306e\u4e0b\u306b\u30cd\u30b9\u30c8\u3055\u308c\u307e\u3059\u3002\u3053\u308c\u306f [Node.js \u306e `AsyncLocalStorage`](https://nodejs.org/api/async_context.html#class-asynclocalstorage) \u307e\u305f\u306f\u5bfe\u5fdc\u3059\u308b\u30dd\u30ea\u30d5\u30a3\u30eb\u3067\u7ba1\u7406\u3055\u308c\u3066\u3044\u307e\u3059\u3002\n+\u30b9\u30d1\u30f3\u306f\u81ea\u52d5\u7684\u306b\u73fe\u5728\u306e\u30c8\u30ec\u30fc\u30b9\u306b\u542b\u307e\u308c\u3001\u6700\u3082\u8fd1\u3044\u73fe\u5728\u306e\u30b9\u30d1\u30f3\u306e\u4e0b\u306b\u30cd\u30b9\u30c8\u3055\u308c\u307e\u3059\u3002\u3053\u308c\u3082 [Node.js `AsyncLocalStorage`](https://nodejs.org/api/async_context.html#class-asynclocalstorage) \u307e\u305f\u306f\u540c\u7b49\u306e\u74b0\u5883\u30dd\u30ea\u30d5\u30a3\u30eb\u3067\u8ffd\u8de1\u3055\u308c\u307e\u3059\u3002\n \n-## \u6a5f\u5fae\u306a\u30c7\u30fc\u30bf\n+## \u6a5f\u5fae\u30c7\u30fc\u30bf\n \n-\u4e00\u90e8\u306e\u30b9\u30d1\u30f3\u306f\u6a5f\u5fae\u306a\u30c7\u30fc\u30bf\u3092\u542b\u3080\u53ef\u80fd\u6027\u304c\u3042\u308a\u307e\u3059\u3002\n+\u4e00\u90e8\u306e\u30b9\u30d1\u30f3\u306f\u6a5f\u5fae\u306a\u30c7\u30fc\u30bf\u3092\u53ce\u96c6\u3059\u308b\u53ef\u80fd\u6027\u304c\u3042\u308a\u307e\u3059\u3002\n \n-`createGenerationSpan()` \u306f LLM \u751f\u6210\u306e\u5165\u51fa\u529b\u3092\u3001`createFunctionSpan()` \u306f\u95a2\u6570\u547c\u3073\u51fa\u3057\u306e\u5165\u51fa\u529b\u3092\u4fdd\u5b58\u3057\u307e\u3059\u3002", "q_link": "https://github.com/openai/openai-agents-js/pull/50/files#diff-e33a96b636fa56e29e33e38e5c9348e548b482bb8769a165ab6ff62d3717fca4", "p_link": "https://github.com/openai/openai-agents-js/pull/58/files#diff-e33a96b636fa56e29e33e38e5c9348e548b482bb8769a165ab6ff62d3717fca4"}, {"name": "docs/src/content/docs/ja/guides/troubleshooting.mdx", "boilerplate": false, "q_patch": "@@ -3,38 +3,38 @@ title: \u30c8\u30e9\u30d6\u30eb\u30b7\u30e5\u30fc\u30c6\u30a3\u30f3\u30b0\n description: Learn how to troubleshoot issues with the OpenAI Agents SDK.\n ---\n \n-## \u5bfe\u5fdc\u74b0\u5883\n+## \u30b5\u30dd\u30fc\u30c8\u3055\u308c\u308b\u5b9f\u884c\u74b0\u5883\n \n-OpenAI Agents SDK \u306f\u3001\u4ee5\u4e0b\u306e\u30b5\u30fc\u30d0\u30fc\u74b0\u5883\u3067\u30b5\u30dd\u30fc\u30c8\u3055\u308c\u307e\u3059:\n+OpenAI Agents SDK \u306f\u6b21\u306e\u30b5\u30fc\u30d0\u30fc\u74b0\u5883\u3067\u30b5\u30dd\u30fc\u30c8\u3055\u308c\u3066\u3044\u307e\u3059:\n \n - Node.js 22+\n - Deno 2.35+\n - Bun 1.2.5+\n \n ### \u5236\u9650\u4ed8\u304d\u30b5\u30dd\u30fc\u30c8\n \n-- **Cloudflare Workers**: Agents SDK \u306f Cloudflare Workers \u3067\u3082\u5229\u7528\u3067\u304d\u307e\u3059\u304c\u3001\u73fe\u5728\u4ee5\u4e0b\u306e\u5236\u9650\u304c\u3042\u308a\u307e\u3059:\n-  - SDK \u3067\u306f `nodejs_compat` \u3092\u6709\u52b9\u306b\u3059\u308b\u5fc5\u8981\u304c\u3042\u308a\u307e\u3059\n-  - SDK \u306f\u52d5\u7684\u30a4\u30f3\u30dd\u30fc\u30c8 `await import('@openai/agents')` \u3067\u306e\u307f\u8aad\u307f\u8fbc\u3081\u307e\u3059\n-  - Cloudflare Workers \u306e `AsyncLocalStorage` \u306e\u9650\u5b9a\u7684\u306a\u30b5\u30dd\u30fc\u30c8\u306b\u3088\u308a\u3001\u30c8\u30ec\u30fc\u30b9\u304c\u6b63\u78ba\u3067\u306a\u3044\u5834\u5408\u304c\u3042\u308a\u307e\u3059\n-- **\u30d6\u30e9\u30a6\u30b6\u30fc**:\n-  - \u30d6\u30e9\u30a6\u30b6\u30fc\u3067\u306f\u30c8\u30ec\u30fc\u30b7\u30f3\u30b0\u306f\u73fe\u5728\u30b5\u30dd\u30fc\u30c8\u3055\u308c\u3066\u3044\u307e\u305b\u3093\n+- **Cloudflare Workers**: Agents SDK \u306f Cloudflare Workers \u3067\u3082\u5229\u7528\u3067\u304d\u307e\u3059\u304c\u3001\u3044\u304f\u3064\u304b\u5236\u9650\u304c\u3042\u308a\u307e\u3059:\n+  - \u73fe\u5728 SDK \u3067\u306f `nodejs_compat` \u3092\u6709\u52b9\u306b\u3059\u308b\u5fc5\u8981\u304c\u3042\u308a\u307e\u3059\n+  - \u30ea\u30af\u30a8\u30b9\u30c8\u7d42\u4e86\u6642\u306b\u30c8\u30ec\u30fc\u30b9\u3092\u624b\u52d5\u3067\u30d5\u30e9\u30c3\u30b7\u30e5\u3059\u308b\u5fc5\u8981\u304c\u3042\u308a\u307e\u3059\u3002\u8a73\u7d30\u306f [\u30c8\u30ec\u30fc\u30b7\u30f3\u30b0](/openai-agents-js/ja/guides/tracing#export-loop-lifecycle) \u3092\u53c2\u7167\u3057\u3066\u304f\u3060\u3055\u3044\n+  - Cloudfl const who=document.getElementById('who'), app=document.getElementById('app');
function key(){return 'rq1_judge_sample50_enriched_humanP_'+(who.value.trim()||'anon')}
let state={};
function load(){try{state=JSON.parse(localStorage.getItem(key()))||{}}catch(e){state={}}}
function save(){localStorage.setItem(key(),JSON.stringify(state));prog()}
function prog(){const n=PAIRS.length,d=PAIRS.filter(p=>state[p.pair_id]&&state[p.pair_id].label).length;
  document.getElementById('cnt').textContent=d+'/'+n;document.getElementById('prog').style.width=(100*d/n)+'%';
  let rev=0,ok=0;
  PAIRS.forEach(p=>{const s=state[p.pair_id]||{};
    if(JUDGE&&s.label&&s.revealed){rev++;if(s.label===p.judge.label)ok++;}
    const c=document.getElementById('c'+p.pair_id);if(c)c.classList.toggle('done',!!s.label)});
  document.getElementById('agr').textContent=rev?('agree '+ok+'/'+rev+' ('+Math.round(100*ok/rev)+'%)'):'';}
function esc(s){return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;')}
function patch(txt){return esc(txt).split('\n').map(l=>{
  const c=l[0]; const cls=c==='+'?'a':c==='-'?'d':(c==='@'?'h':'');
  return cls?`<span class="${cls}">${l}</span>`:l;}).join('\n');}
function patchBlock(label,txt){return txt&&txt.trim().length
  ?`<div class="plab">${label}</div><pre class="patch">${patch(txt)}</pre>`:''}
function fileBlock(f){
  const links=`<span class="flink">[<a href="${esc(f.q_link)}" target="_blank" rel="noopener">Q diff</a>] `
            +`[<a href="${esc(f.p_link)}" target="_blank" rel="noopener">P diff</a>]</span>`;
  const body=patchBlock('Q patch (candidate fix)',f.q_patch)+patchBlock('P patch (original)',f.p_patch);
  if(body){
    return `<details class="diff"><summary><span class="fname">${esc(f.name)}</span>${links}</summary>`
         +`<div class="pwrap">${body}</div></details>`;}
  return `<div style="margin:3px 0"><span class="fname">${esc(f.name)}</span>${links} `
       +`<span class="legend">(no patch — file removed/binary/too large)</span></div>`;}
function judgeHtml(p,st){
  if(!st.label) return `<div class="legend jbtn">Pick a label to unlock the judge's call.</div>`;
  if(!st.revealed) return `<button class="sec jbtn" data-reveal="${p.pair_id}">Reveal judge ▸</button>`;
  const agree=st.label===p.judge.label;
  const badge=`<span class="badge ${agree?'ok':'no'}">${agree?'AGREE':'DISAGREE'}</span>`;
  return `<div class="judge ${agree?'agree':'disagree'}">
    <div class="jverdict">Judge: ${esc(p.judge.label)} <span class="legend">(conf ${esc(p.judge.confidence)})</span>${badge}</div>
    <div class="jr">${esc(p.judge.rationale)}</div>
    ${p.judge.evidence.length?`<div class="legend" style="margin-top:4px">evidence: ${p.judge.evidence.map(esc).join(' · ')}</div>`:''}
  </div>`;}
function render(){app.innerHTML='';PAIRS.forEach(p=>{

  const has=f=>!!(((f.q_patch||'').trim())||((f.p_patch||'').trim()));
  const sub=(p.shared||[]).filter(f=>!f.boilerplate&&has(f));
  const nopatch=(p.shared||[]).filter(f=>!f.boilerplate&&!has(f));
  const boil=(p.shared||[]).filter(f=>f.boilerplate);
  let filesHtml='';
  if(p.fetch_ok===false){

  }else if((p.n_net_shared||0)===0){

      +`Likely not a genuine fix; verify via the PRs above.</div>`;
  }else{
    if(sub.length){filesHtml+=`<div class="fhdr">Substantive shared files (${sub.length})</div>`+sub.map(fileBlock).join('');}

    if(nopatch.length){filesHtml+=`<div class="fhdr">Shared files with no captured diff (${nopatch.length})</div>`
      +`<div class="note muted">Counted as shared but no patch was stored (file dropped/oversized/binary) — open the diff links to check on GitHub.</div>`
      +nopatch.map(fileBlock).join('');}
    if(boil.length){filesHtml+=`<div class="fhdr">Boilerplate shared files (${boil.length})</div>`
      +`<div class="boil">${boil.map(f=>esc(f.name)).join(' · ')}</div>`;}
  }
  const refTag=p.q_references_p?`<span class="tag ref">★ Q references P</span>`:'';
  const netTag=p.fetch_ok===false?`<span class="tag warn">diff n/a</span>`

  const ctxTag=p.context_complete===false?`<span class="tag warn">ctx truncated</span>`:'';
  const div=document.createElement('div');div.className='card';div.id='c'+p.pair_id;

    <div class="pr"><b>P (original):</b> <a href="${esc(p.p_url)}" target="_blank" rel="noopener">${esc(p.p_url)}</a>
      <span class="flink">[<a href="${esc(p.p_url)}/files" target="_blank" rel="noopener">Files ▸</a>]</span>
      <br><span class="ttl">${esc(p.p_title)}</span></div>
    <div class="pr"><b>Q (candidate fix):</b> <a href="${esc(p.q_url)}" target="_blank" rel="noopener">${esc(p.q_url)}</a>
      <span class="flink">[<a href="${esc(p.q_url)}/files" target="_blank" rel="noopener">Files ▸</a>]</span>
      <br><span class="ttl">${esc(p.q_title)}</span>
      <div class="files">${filesHtml}</div></div>
    ${p.prov_warn?`<div class="note warn">⚠ ${esc(p.prov_warn)}</div>`:''}

    <input class="reason" type="text" placeholder="reason (≤15 words)" value="${esc(st.reason||'')}" data-r="${p.pair_id}">
    ${JUDGE?`<div class="jpanel" id="j${p.pair_id}">${judgeHtml(p,st)}</div>`:''}`;
  app.appendChild(div);
});
