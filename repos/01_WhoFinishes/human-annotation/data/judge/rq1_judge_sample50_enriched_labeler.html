eby format` as your final step after making changes\n \n ### Test Locations\n \n@@ -317,11 +329,14 @@ When fixing bugs or implementing features, follow this workflow:\n    - Once you've got the basics figured out, enhance your test to cover edge cases and other variations\n    - Run the test again and commit the baseline diff along with the test edit\n \n-5. **Run all other tests to ensure you didn't break anything**\n-   - Run `npx hereby runtests-parallel` and wait for it to finish (10-15 minutes is normal!)\n+5. **\ud83d\udea8 MANDATORY: Run all other tests to ensure you didn't break anything**\n+   - **REQUIRED:** Run `npx hereby runtests-parallel` and wait for it to finish (10-15 minutes is normal!)\n+   - **THIS STEP CANNOT BE SKIPPED** - patience is essential!\n    - Some collateral baseline changes are normal, but review for correctness\n    - Put these diffs in another commit\n \n-6. **Always format and lint**\n-   - Don't forget to run `npx hereby lint` and `npx hereby format` before you're done\n+6. **\ud83d\udea8 MANDATORY: Lint and format your changes**\n+   - **REQUIRED:** Run `npx hereby lint` and fix ALL issues\n+   - **REQUIRED:** Run `npx hereby format` before you're done\n+   - **YOU CANNOT FINISH WITHOUT THESE STEPS**\n    - Double-check your line endings. Source files in this repo typically use CRLF line endings. Fix all line endings to be consistent before you wrap up", "p_patch": "@@ -0,0 +1,292 @@\n+# TypeScript Test Writing Guide for Copilot\n+\n+This document provides a concise guide for writing TypeScript fourslash tests and compiler tests, along with build instructions.\n+\n+## Build Instructions Summary\n+\n+### Setup\n+1. Install Node.js (current or LTS)\n+2. Install hereby: `npm install -g hereby`\n+3. Clone the repository: `git clone --depth=1 https://github.com/microsoft/TypeScript`\n+4. Install dependencies: `npm ci`\n+\n+### Common Build Tasks\n+```bash\n+hereby local             # Build the compiler into built/local\n+hereby clean             # Delete the built compiler  \n+hereby tests             # Build the test infrastructure\n+hereby runtests          # Run all tests\n+hereby runtests-parallel # Run tests in parallel (recommended)\n+hereby runtests --runner=fourslash # Run only fourslash tests\n+hereby runtests --runner=compiler # Run only compiler tests\n+hereby runtests --tests=\u003ctestPath\u003e # Run specific test\n+hereby baseline-accept   # Accept new test baselines\n+hereby lint              # Run eslint\n+hereby format            # Run code formatting\n+```\n+\n+## Fourslash Test Syntax Guide\n+\n+Fourslash tests are interactive TypeScript language service tests. They validate IDE features like completions, quick info, navigation, and refactoring.\n+\n+### Basic Structure\n+```typescript\n+/// \u003creference path='fourslash.ts'/\u003e\n+\n+////code goes here with /*markers*/\n+\n+// Test assertions go here\n+```\n+\n+### Key Syntax Elements\n+\n+#### 1. Source Code Definition\n+Use `////` to define source code lines:\n+```typescript\n+////function foo(x: number) {\n+////    return x + 1;\n+////}\n+////let result = foo(/*marker*/42);\n+```\n+\n+#### 2. Markers for Positioning\n+Use `/**/` for anonymous markers or `/*name*/` for named markers:\n+```typescript\n+////let x = /*1*/someValue;\n+////let y = /*cursor*/anotherValue;\n+```\n+\n+#### 3. Multi-file Tests\n+Use `// @Filename:` to define multiple files:\n+```typescript\n+// @Filename: /a.ts\n+////export const value = 42;\n+\n+// @Filename: /b.ts  \n+////import { value } from './a';\n+////console.log(/*marker*/value);\n+```\n+\n+#### 4. Ranges\n+Use `[|text|]` to define text ranges:\n+```typescript\n+////function test() {\n+////    [|return 42;|]\n+////}\n+```\n+\n+### Common API Patterns\n+\n+#### Navigation \u0026 Positioning\n+```typescript\n+goTo.marker(\"markerName\");         // Navigate to marker\n+goTo.marker();                     // Navigate to anonymous marker /**/\n+```\n+\n+#### Verification (Prefer these over baselines)\n+```typescript\n+verify.currentLineContentIs(\"expected content\");\n+verify.completions({ includes: \"itemName\" });\n+verify.completions({ excludes: \"itemName\" });\n+verify.quickInfoIs(\"expected info\");\n+verify.codeFix({\n+    description: \"Fix description\",\n+    newFileContent: \"expected content after fix\"\n+});\n+```\n+\n+#### Completions Testing\n+```typescript\n+verify.completions({ \n+    marker: \"1\",\n+    includes: { name: \"foo\", source: \"/a\", hasAction: true },\n+    isNewIdentifierLocation: true,\n+    preferences: { includeCompletionsForModuleExports: true }\n+});\n+```\n+\n+#### Code Fixes Testing\n+```typescript\n+verify.codeFix({\n+    description: \"Add missing property\",\n+    index: 0,\n+    newFileContent: `class C {\n+    property: string;\n+    method() { this.property = \"value\"; }\n+}`\n+});\n+```\n+\n+#### Formatting\n+```typescript\n+format.document();\n+verify.currentLineContentIs(\"formatted content\");\n+```\n+\n+### Simple Example\n+```typescript\n+/// \u003creference path='fourslash.ts'/\u003e\n+\n+////interface User {\n+////    name: string;\n+////}\n+////\n+////const user: User = {\n+////    /*completion*/\n+////};\n+\n+verify.completions({\n+    marker: \"completion\",\n+    includes: { name: \"name\", sortText: \"0\" }\n+});\n+```\n+\n+## Compiler Test Syntax Guide\n+\n+Compiler tests validate TypeScript compilation behavior, type checking, and error reporting.\n+\n+### Basic Structure\n+- Simple `.ts` files in `tests/cases/compiler/`\n+- Use comments to indicate expected behavior\n+- No special test harness - just TypeScript code\n+\n+### Compiler Directives\n+Use `// @directive: value` for compiler options:\n+```typescript\n+// @strict: true\n+// @target: ES2015\n+// @lib: ES2015,DOM\n+\n+let x: string = 42; // Error expected\n+```\n+\n+### Common Directives\n+```typescript\n+// @strict: true/false\n+// @noImplicitAny: true/false  \n+// @target: ES5/ES2015/ES2020/ESNext\n+// @module: commonjs/amd/es6/esnext\n+// @lib: ES5,DOM/ES2015/ES2020\n+// @declaration: true/false\n+// @skipLibCheck: true/false\n+```\n+\n+### Multi-file Tests\n+```typescript\n+// @Filename: helper.ts\n+export function helper(x: number): string {\n+    return x.toString();\n+}\n+\n+// @Filename: main.ts  \n+import { helper } from \"./helper\";\n+const result = helper(42);\n+```\n+\n+### Error Expectations\n+Use comments to document expected behavior:\n+```typescript\n+abstract class Base {\n+    abstract method(): void;\n+}\n+\n+class Derived extends Base {\n+    // Missing implementation - should error\n+}\n+\n+new Base(); // Should error - cannot instantiate abstract class\n+```\n+\n+### Type Testing Patterns\n+```typescript\n+// Test type inference\n+let inferred = [1, 2, 3]; // Should infer number[]\n+\n+// Test type compatibility  \n+type A = { x: number };\n+type B = { x: number; y: string };\n+let a: A = { x: 1 };\n+let b: B = { x: 1, y: \"hello\" };\n+a = b; // Should work - B is assignable to A\n+b = a; // Should error - A missing property y\n+```\n+\n+### Simple Example\n+```typescript\n+// Test that optional properties work correctly\n+interface Config {\n+    required: string;\n+    optional?: number;\n+}\n+\n+const config1: Config = { required: \"test\" }; // Should work\n+const config2: Config = { required: \"test\", optional: 42 }; // Should work  \n+const config3: Config = { optional: 42 }; // Should error - missing required\n+```\n+\n+## Test Writing Best Practices\n+\n+### For Fourslash Tests\n+1. **Prefer validation over baselines** - Use `verify.currentLineContentIs()` instead of `verify.baseline*()`\n+2. **Use simple, focused examples** - Test one feature at a time\n+3. **Name markers clearly** - Use descripti", "q_link": "https://github.com/microsoft/TypeScript/pull/61950/files#diff-227c2c26cb2ee0ce0f46a320fc48fbcbdf21801a57f59161b1d0861e8aad55f5", "p_link": "https://github.com/microsoft/TypeScript/pull/61900/files#diff-227c2c26cb2ee0ce0f46a320fc48fbcbdf21801a57f59161b1     converter: HFCheckpointConverter = model_config.hf_checkpoint_converter()\n+            converter = converter.replaced(reference_checkpoint=config.hf_checkpoint, tokenizer=tokenizer)\n+            model = converter.load_pretrained(model_config.model_type, ref=config.hf_checkpoint, dtype=mp.compute_dtype)\n+        else:\n+            raise ValueError(\"Must specify checkpoint_path or hf_checkpoint\")\n+\n+        log_probs = []\n+        for batch in loader:\n+            lp = compute_log_probs(model, batch)\n+            log_probs.append(np.array(lp))\n+\n+        if not log_probs:\n+            raise ValueError(\"No data processed\")\n+\n+        lp_matrix = np.concatenate(log_probs, axis=0)\n+        prob_matrix = np.exp(lp_matrix)\n+\n+        fig, ax = plt.subplots(figsize=(8, 6))\n+        im = ax.imshow(prob_matrix.T, vmin=0, vmax=1, aspect=\"auto\", origin=\"lower\")\n+        ax.set_xlabel(\"Example\")\n+        ax.set_ylabel(\"Position\")\n+        fig.colorbar(im, ax=ax)\n+        plt.tight_layout()\n+        path = \"sliding_eval_heatmap.png\"\n+        fig.savefig(path)\n+        levanter.tracker.log_artifact(path, name=path, type=\"plot\")\n+\n+    levanter.tracker.current_tracker().finish()\n+\n+\n+if __name__ == \"__main__\":\n+    levanter.config.main(main)()", "q_link": "https://github.com/stanford-crfm/levanter/pull/1009/files#diff-6c0f0946c6628bce987283d7280d340abde032c61ba7ca2ba3df277be7d2a31a", "p_link": "https://github.com/stanford-crfm/levanter/pull/1008/files#diff-6c0f0946c6628bce987283d7280d340abde032c61ba7ca2ba3df277be7d2a31a"}], "n_net_shared": 1, "n_net_substantive": 1, "context_complete": true, "prov_warn": "", "judge": {"label": "Direct fix", "confidence": 0.82, "rationale": "Q replaces the exact config type/default P introduced (`SingleDatasetLMConfigBase`/`SingleDatasetLMConfigBase()` -\u003e `SingleDatasetLMConfig`/`UrlSingleDatasetLMConfig`), which blame confirms were P-authored lines, correcting P's dataset-config decoding so
