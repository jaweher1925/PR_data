[project]
name = "pr-fix-authorship"
version = "1.0.0"
description = "Replication package: Who Finishes the Job? A study of follow-up fixes and commit authorship on AI coding agent pull requests"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "Wannita Takerngsaksiri", email = "wannita.takerngsaksiri@deakin.edu.au" }]
dependencies = [
  "duckdb>=1.1",
  "pandas>=2.2",
  "pyarrow>=16",
  "huggingface-hub>=0.25",
  "rich>=13.7",
  "scipy>=1.13",
  "numpy>=1.26",
  "matplotlib>=3.9",
  "seaborn>=0.13",
  "scikit-learn>=1.5",                     # cohen_kappa_score in the LLM-judge engine
  "statsmodels>=0.14",
  "litellm>=1.74",                         # unified OpenAI+Anthropic transport for the RQ1 LLM judge
  "pyyaml>=6",                             # judge.yaml config parsing in run_judge
]

[project.optional-dependencies]
dev = [
  "pytest>=8",
  "pytest-cov>=5",
  "ruff>=0.6",
  "ipykernel>=6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/prfix"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "PL"]
# The "too many X" family flags the shape of the analysis entry points
# (one function per RQ table, read frames -> fit -> emit rows). Splitting them
# would scatter a single reproducible computation across helpers for no reader
# benefit, so the whole family is off, not just PLR0913.
# PLC0415: heavy or optional dependencies (duckdb, matplotlib) and
# circular-import breakers are imported inside the function that needs them,
# so the light import paths stay importable.
ignore = ["PLR0911", "PLR0912", "PLR0913", "PLR0915", "PLR0917", "PLC0415"]

[tool.ruff.lint.per-file-ignores]
# Magic values are idiomatic in test assertions/fixtures.
"tests/**" = ["PLR2004"]
# The pinned expected cells in the reproduction gates ARE the assertion; naming
# each literal as a constant would only hide what is being checked.
"human-annotation/**" = ["PLR2004"]
# gen_labeler.py embeds the annotator UI as one HTML/CSS/JS template literal;
# its minified CSS rules and JS lines exceed the limit and rewrapping them would
# edit shipped markup, so E501 is off for that file only.
"human-annotation/gen_labeler.py" = ["PLR2004", "E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
